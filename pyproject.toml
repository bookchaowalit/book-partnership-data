[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-partnership-data"
version = "0.1.0"
description = "Compare ongoing commercial partner programs and payout obligations."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-partnership-data = "book_partnership_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_partnership_data = ["*.json"]
